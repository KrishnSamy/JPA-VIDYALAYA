<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Panel | JPA Vidyalaya</title>
<link rel="icon" href="/uploads/favicon.png">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="login-card" autocomplete="on">
    <img src="/uploads/logo.jpg" alt="JPA logo" width="84" height="84">
    <h1>Admin Panel</h1>
    <p class="sub">JPA Vidyalaya Matric School</p>
    <label>Username<input name="username" autocomplete="username" required autofocus></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
    <p class="err" id="login-err" role="alert"></p>
    <a class="back" href="/">← Back to website</a>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side" id="side">
    <div class="side-brand"><img src="/uploads/logo.jpg" alt="" width="40" height="40"><div><b>JPA Vidyalaya</b><small>Admin Panel</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot"><a href="/" target="_blank" rel="noopener">🌐 View website</a><button id="logout" class="linkbtn">⎋ Sign out</button></div>
  </aside>
  <div class="main">
    <header class="top"><button id="menu-btn" class="icon-btn" aria-label="Menu">☰</button><h1 id="title"></h1><span class="who" id="who"></span></header>
    <div id="alert" class="alert" hidden></div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<div id="modal" class="modal" hidden><div class="modal-box" role="dialog" aria-modal="true"><div class="modal-head"><h2 id="modal-title"></h2><button class="icon-btn" id="modal-x" aria-label="Close">×</button></div><div id="modal-body"></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/admin/admin.js"></script>
</body>
</html>
